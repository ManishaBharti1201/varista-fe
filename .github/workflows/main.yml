name: CI/CD Pipeline - React to Docker Hub, VM & Android

on:
  push:
    branches: [ main ]

jobs:
  init-notifications:
    name: Start Slack Thread
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.slack.outputs.thread_ts }}
    steps:
      - name: Create Slack Thread
        id: slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Pipeline Execution Started"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* `${{ github.event.head_commit.message }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Details>" }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-and-push:
    name: Build Image & Push to Docker Hub
    needs: [init-notifications, build-android]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK for frontend image
        uses: actions/download-artifact@v4
        with:
          name: varista-debug-apk
          path: public/downloads

      - name: Name APK for public download
        run: mv public/downloads/app-debug.apk public/downloads/varista.apk

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-fe:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v4
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-bff:latest

      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ job.status == 'success' && '✅ *Docker Images Pushed*' || '❌ *Docker Build Failed*' }}\n*Images:* `varista-fe:latest`, `varista-bff:latest`"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-android:
    name: Build Android Debug APK
    needs: init-notifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build React Frontend
        run: CI=false npm run build

      - name: Sync and Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: varista-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ job.status == 'success' && '✅ *Android APK Ready*' || '❌ *Android Build Failed*' }}\n📦 *Download:* <${{ steps.upload-apk.outputs.artifact-url }}|Click here to Download APK>"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy:
    name: Deploy to Ubuntu VM
    needs: [init-notifications, build-and-push]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Local Update and Deploy
        run: |
            cd ~/varista || exit 1
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            echo "INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}" > .env
            echo "INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}" >> .env
            echo "INFISICAL_ENVIRONMENT=prod" >> .env
            docker compose pull
            docker compose up -d --force-recreate

  verify-endpoints:
    name: Verify deployed endpoints
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      health: ${{ steps.check.outputs.health }}
      clients: ${{ steps.check.outputs.clients }}
      apk: ${{ steps.check.outputs.apk }}
    steps:
      - name: Check public endpoints
        id: check
        shell: bash
        run: |
          set +e
          check_url() {
            url=$1
            response_file=$2
            max_time=$3
            status=000
            for attempt in 1 2 3 4; do
              status=$(curl -sS -o "$response_file" -w '%{http_code}' --max-time "$max_time" "$url")
              [ "$status" = "200" ] && break
              [ "$attempt" = "4" ] || sleep 5
            done
            printf '%s' "${status:-000}"
          }

          frontend_status=$(check_url https://varista.coresmith.duckdns.org/ /dev/null 20)
          health_status=$(check_url https://bff.coresmith.duckdns.org/api/health /dev/null 20)
          clients_status=$(check_url https://bff.coresmith.duckdns.org/api/clients "$RUNNER_TEMP/clients.json" 20)
          apk_status=$(check_url https://varista.coresmith.duckdns.org/downloads/varista.apk /dev/null 60)

          if [ "$clients_status" = "200" ] && ! python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(data,list) and len(data)>0 else 1)' "$RUNNER_TEMP/clients.json"; then
            clients_status="invalid catalog"
          fi

          echo "frontend=$frontend_status" >> "$GITHUB_OUTPUT"
          echo "health=$health_status" >> "$GITHUB_OUTPUT"
          echo "clients=$clients_status" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_status" >> "$GITHUB_OUTPUT"

          printf 'Frontend: %s\nBFF health: %s\nBFF clients: %s\nAPK download: %s\n' \
            "$frontend_status" "$health_status" "$clients_status" "$apk_status"

          [ "$frontend_status" = "200" ] &&
            [ "$health_status" = "200" ] &&
            [ "$clients_status" = "200" ] &&
            [ "$apk_status" = "200" ]

  pipeline-summary:
    name: Post pipeline summary to Slack
    needs: [init-notifications, build-android, build-and-push, deploy, verify-endpoints]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post stages and endpoint results
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "blocks": [
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🏁 *Pipeline summary*\n• Android APK build: `${{ needs.build-android.result }}`\n• Docker image build/push: `${{ needs.build-and-push.result }}`\n• VM deployment: `${{ needs.deploy.result }}`\n• Endpoint checks: `${{ needs.verify-endpoints.result }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployed endpoints*\n• Frontend: <https://varista.coresmith.duckdns.org/|https://varista.coresmith.duckdns.org/> — `${{ needs.verify-endpoints.outputs.frontend }}`\n• BFF health: <https://bff.coresmith.duckdns.org/api/health|/api/health> — `${{ needs.verify-endpoints.outputs.health }}`\n• BFF clients: <https://bff.coresmith.duckdns.org/api/clients|/api/clients> — `${{ needs.verify-endpoints.outputs.clients }}`\n• Latest APK: <https://varista.coresmith.duckdns.org/downloads/varista.apk|Download APK> — `${{ needs.verify-endpoints.outputs.apk }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
