name: CI/CD Pipeline - React to Docker Hub, VM & Android
on:
  push:
    branches: [ main ]

jobs:
  # 1. Start the Thread
  init-notifications:
    name: Start Slack Thread
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.slack.outputs.thread_ts }}
    steps:
      - name: Create Slack Thread
        id: slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "🚀 *Pipeline Started:* `${{ github.event.head_commit.message }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Pipeline Started*\n*Repo:* ${{ github.repository }}\n*Commit:* `${{ github.event.head_commit.message }}`"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-and-push:
    name: Build Image & Push to Docker Hub
    needs: init-notifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Example of "Before" notification in thread
      - name: Notify Job Start
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: '{"text": "🛠️ Starting Docker Build & Push..."}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push BFF/Frontend
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-fe:latest

      # "After" notification
      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ Docker Images Pushed' || '❌ Docker Build Failed' }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-android:
    name: Build Android Debug APK
    needs: init-notifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Notify Job Start
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: '{"text": "📱 Starting Android APK Build..."}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # ... (Your existing APK build steps here) ...
      - name: Sync and Build
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ Android APK Ready' || '❌ Android Build Failed' }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy:
    name: Deploy to Ubuntu VM
    needs: [init-notifications, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Job Start
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: '{"text": "🌐 Deploying to VM..."}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: SSH and Update VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # ... your deploy script ...

      - name: Final Pipeline Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          thread-ts: ${{ needs.init-notifications.outputs.thread_ts }}
          payload: |
            {
              "text": "🏁 *Deployment ${{ job.status }}!*"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
