name: CI/CD Pipeline - React to Docker Hub & VM

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the unique commit hash
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/react-app:${{ github.sha }}
          # If your Dockerfile needs env vars during 'npm run build'
          # build-args: |
          #   REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}

      - name: Build and push BFF image
        uses: docker/build-push-action@v4
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ secrets.bhanuchandra2010 }}/varista-bff:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.bhanuchandra2010 }}/varista-fe:latest

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read .env from repo
        id: read_env
        run: |
          echo "ENV_FILE_CONTENT<<EOF" >> $GITHUB_ENV
          cat ./bff/.env >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: SSH and Update VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Replace with secrets or keep as-is if you want to hardcode the IP/user
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          # Support both key-based auth (preferred) and password auth (fallback)
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            # 1. Navigate to deployment folder
            cd ~/varista

            # 2. Login to Docker Hub on the VM using password (set DOCKERHUB_PASSWORD secret)
            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. Overwrite the .env file with the latest content from repository
            cat <<'EOF' > ./bff/.env
${{ env.ENV_FILE_CONTENT }}
EOF

            # 4. Pull the specific image we just built
            docker compose pull

            # 5. Restart services with the new environment variables
            docker compose up -d --force-recreate
