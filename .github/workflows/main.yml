name: CI/CD Pipeline - React to Docker Hub & VM

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push BFF image
        uses: docker/build-push-action@v4
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-bff:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-fe:latest

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to deployment folder
            cd ~/varista
            
            # # 2. Login to Docker Hub on the VM
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 3. Overwrite the .env file with the latest secrets
            # This handles the manual step you were doing
            cat <<EOF > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            # 4. Pull the specific image we just built
            docker compose pull
            
            # 5. Restart services with the new environment variables
            docker compose up -d --force-recreate
