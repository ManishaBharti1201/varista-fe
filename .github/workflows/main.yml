name: CI/CD Pipeline - React to Docker Hub, VM & Android

on:
  push:
    branches: [ main ]

jobs:
  init-notifications:
    name: Start Slack Thread
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.slack.outputs.thread_ts }}
    steps:
      - name: Create Slack Thread
        id: slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Pipeline Execution Started"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* `${{ github.event.head_commit.message }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": "🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Details>" }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-and-push:
    name: Build Image & Push to Docker Hub
    needs: [init-notifications]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-fe:latest

      - name: Build and push BFF image
        uses: docker/build-push-action@v4
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-bff:latest

      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ job.status == 'success' && '✅ *Docker Images Pushed*' || '❌ *Docker Build Failed*' }}\n*Images:* `varista-fe:latest`, `varista-bff:latest`"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  build-android:
    name: Build Signed Android Release APK
    needs: init-notifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build React Frontend
        run: CI=false npm run build

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Configure the $name repository secret before building app updates." >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Sync and Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PVERSION_CODE="$GITHUB_RUN_NUMBER" \
            -PVERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/varista-apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/varista-apk/Syncra.apk"
          VERSION_CODE="$GITHUB_RUN_NUMBER" \
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER" \
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/varista-apk/Syncra.apk" | cut -d ' ' -f 1)" \
          node -e '
            const fs = require("fs");
            const { VERSION_CODE, VERSION_NAME, APK_SHA256 } = process.env;
            const manifest = {
              versionCode: Number(VERSION_CODE),
              versionName: VERSION_NAME,
              apkUrl: `https://varista.coresmith.duckdns.org/downloads/Syncra-${VERSION_CODE}.apk`,
              sha256: APK_SHA256
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/varista-apk/version.json`, JSON.stringify(manifest, null, 2));
          '

      - name: Upload APK Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: Syncra-android-apk
          path: |
            ${{ runner.temp }}/varista-apk/Syncra.apk
            ${{ runner.temp }}/varista-apk/version.json
          retention-days: 7

      - name: Notify Job Status
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ job.status == 'success' && '✅ *Android APK Ready*' || '❌ *Android Build Failed*' }}\n📦 *Download:* <${{ steps.upload-apk.outputs.artifact-url }}|Click here to Download APK>"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy:
    name: Deploy to Ubuntu VM
    needs: [init-notifications, build-and-push, build-android]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Syncra-android-apk
          path: ${{ runner.temp }}/varista-apk

      - name: Local Update and Deploy
        run: |
            cd ~/varista || exit 1
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            echo "INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}" > .env
            echo "INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}" >> .env
            echo "INFISICAL_ENVIRONMENT=prod" >> .env
            docker compose pull
            docker compose up -d --force-recreate
            frontend_container=$(docker compose ps -q frontend)
            if [ -z "$frontend_container" ]; then
              echo "Frontend container is not running after deployment" >&2
              exit 1
            fi
            downloads_dir="$HOME/varista/data/downloads"
            mkdir -p "$downloads_dir"
            chmod 755 "$downloads_dir"
            mounted_downloads_dir=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/usr/share/nginx/html/downloads"}}{{.Source}}{{end}}{{end}}' "$frontend_container")
            if [ -z "$mounted_downloads_dir" ] || [ "$(realpath "$mounted_downloads_dir")" != "$(realpath "$downloads_dir")" ]; then
              echo "Mount $downloads_dir to /usr/share/nginx/html/downloads in the frontend service." >&2
              exit 1
            fi
            cp "$RUNNER_TEMP/varista-apk/Syncra.apk" "$downloads_dir/Syncra-$GITHUB_RUN_NUMBER.apk"
            cp "$RUNNER_TEMP/varista-apk/Syncra.apk" "$downloads_dir/Syncra.apk"
            cp "$RUNNER_TEMP/varista-apk/version.json" "$downloads_dir/version.json.tmp"
            mv "$downloads_dir/version.json.tmp" "$downloads_dir/version.json"

  verify-endpoints:
    name: Verify deployed endpoints
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      health: ${{ steps.check.outputs.health }}
      clients: ${{ steps.check.outputs.clients }}
      apk: ${{ steps.check.outputs.apk }}
      update_manifest: ${{ steps.check.outputs.update_manifest }}
    steps:
      - name: Check public endpoints
        id: check
        shell: bash
        run: |
          set +e
          check_url() {
            url=$1
            response_file=$2
            max_time=$3
            status=000
            for attempt in 1 2 3 4; do
              status=$(curl -sS -o "$response_file" -w '%{http_code}' --max-time "$max_time" "$url")
              [ "$status" = "200" ] && break
              [ "$attempt" = "4" ] || sleep 5
            done
            printf '%s' "${status:-000}"
          }

          frontend_status=$(check_url https://varista.coresmith.duckdns.org/ /dev/null 20)
          health_status=$(check_url https://bff.coresmith.duckdns.org/api/health /dev/null 20)
          clients_status=$(check_url https://bff.coresmith.duckdns.org/api/clients "$RUNNER_TEMP/clients.json" 20)
          manifest_status=$(check_url https://varista.coresmith.duckdns.org/downloads/version.json "$RUNNER_TEMP/version.json" 20)

          if [ "$clients_status" = "200" ] && ! python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(data,list) and len(data)>0 else 1)' "$RUNNER_TEMP/clients.json"; then
            clients_status="invalid catalog"
          fi
          if [ "$manifest_status" = "200" ] && ! python3 -c 'import json,re,sys; data=json.load(open(sys.argv[1])); code=data.get("versionCode"); sys.exit(0 if isinstance(code,int) and code>0 and data.get("versionName") and data.get("apkUrl")==f"https://varista.coresmith.duckdns.org/downloads/Syncra-{code}.apk" and re.fullmatch(r"[0-9a-fA-F]{64}",data.get("sha256","")) else 1)' "$RUNNER_TEMP/version.json"; then
            manifest_status="invalid manifest"
          fi
          if [ "$manifest_status" = "200" ]; then
            apk_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["apkUrl"])' "$RUNNER_TEMP/version.json")
            apk_status=$(check_url "$apk_url" "$RUNNER_TEMP/Syncra.apk" 60)
            if [ "$apk_status" = "200" ] && ! python3 -c 'import sys,zipfile; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)' "$RUNNER_TEMP/Syncra.apk"; then
              apk_status="invalid APK"
            elif [ "$apk_status" = "200" ] && ! python3 -c 'import hashlib,json,sys; manifest=json.load(open(sys.argv[1])); actual=hashlib.sha256(open(sys.argv[2],"rb").read()).hexdigest(); sys.exit(0 if actual.lower()==manifest["sha256"].lower() else 1)' "$RUNNER_TEMP/version.json" "$RUNNER_TEMP/Syncra.apk"; then
              apk_status="checksum mismatch"
            fi
          else
            apk_status="update manifest unavailable"
          fi

          echo "frontend=$frontend_status" >> "$GITHUB_OUTPUT"
          echo "health=$health_status" >> "$GITHUB_OUTPUT"
          echo "clients=$clients_status" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_status" >> "$GITHUB_OUTPUT"
          echo "update_manifest=$manifest_status" >> "$GITHUB_OUTPUT"

          printf 'Frontend: %s\nBFF health: %s\nBFF clients: %s\nAPK download: %s\nUpdate manifest: %s\n' \
            "$frontend_status" "$health_status" "$clients_status" "$apk_status" "$manifest_status"

          [ "$frontend_status" = "200" ] &&
            [ "$health_status" = "200" ] &&
            [ "$clients_status" = "200" ] &&
            [ "$apk_status" = "200" ] &&
            [ "$manifest_status" = "200" ]

  pipeline-summary:
    name: Post pipeline summary to Slack
    needs: [init-notifications, build-android, build-and-push, deploy, verify-endpoints]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post stages and endpoint results
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "thread_ts": "${{ needs.init-notifications.outputs.thread_ts }}",
              "blocks": [
                { "type": "divider" },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🏁 *Pipeline summary*\n• Signed Android APK build: `${{ needs.build-android.result }}`\n• Docker image build/push: `${{ needs.build-and-push.result }}`\n• VM deployment: `${{ needs.deploy.result }}`\n• Endpoint checks: `${{ needs.verify-endpoints.result }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployed endpoints*\n• Frontend: <https://varista.coresmith.duckdns.org/|https://varista.coresmith.duckdns.org/> — `${{ needs.verify-endpoints.outputs.frontend }}`\n• BFF health: <https://bff.coresmith.duckdns.org/api/health|/api/health> — `${{ needs.verify-endpoints.outputs.health }}`\n• BFF clients: <https://bff.coresmith.duckdns.org/api/clients|/api/clients> — `${{ needs.verify-endpoints.outputs.clients }}`\n• Update manifest: `${{ needs.verify-endpoints.outputs.update_manifest }}`\n• Latest APK: <https://varista.coresmith.duckdns.org/downloads/Syncra.apk|Download Syncra APK> — `${{ needs.verify-endpoints.outputs.apk }}`"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
