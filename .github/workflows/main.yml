name: CI/CD Pipeline - React to Docker Hub, VM & Android

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build Image & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push BFF image
        uses: docker/build-push-action@v4
        with:
          context: ./bff
          file: ./bff/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-bff:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/varista-fe:latest

  # 📱 NEW: Android Debug APK Job
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build React Frontend
        run: CI=false npm run build # Ensure this creates your 'dist' or 'build' folder

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: varista-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      
      - name: List files to find APK
        run: find . -name "*.apk"

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/varista || { echo "Directory not found"; exit 1; }
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cat <<'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f