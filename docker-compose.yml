version: '3.8'

services:
  bff:
    image: bhanuchandra2010/varista-bff:latest
    container_name: varista-bff
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - PORT=4000
      - EXTERNAL_SERVICE_BASE_URL=http://varista-backend:8080
      - FRONTEND_ORIGINS=https://bff.coresmith.duckdns.org
      - INFISICAL_SITE_URL=https://app.infisical.com
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=c79f356b-0e30-4165-83b4-b7434065376c
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-prod}
      - INFISICAL_SECRET_PATH=/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.bff.rule=Host(`bff.coresmith.duckdns.org`)"
      - "traefik.http.routers.bff.entrypoints=websecure"
      - "traefik.http.routers.bff.tls.certresolver=duckdns"
      - "traefik.http.services.bff.loadbalancer.server.port=4000"
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BFF_URL: https://bff.coresmith.duckdns.org
    image: bhanuchandra2010/varista-fe:latest
    container_name: varista-frontend
    ports:
      - "3001:80"
    restart: unless-stopped
    volumes:
      - ./data/invoice:/app/invoice:rw
      - ./data/quotation:/app/quotation:rw
    environment:
      - EXTERNAL_SERVICE_BASE_URL=https://service.coresmith.duckdns.org
      - FRONTEND_ORIGINS=https://bff.coresmith.duckdns.org
      - REACT_APP_BFF_URL=https://bff.coresmith.duckdns.org
    depends_on:
      - bff
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.varista.rule=Host(`varista.coresmith.duckdns.org`)"
      - "traefik.http.routers.varista.entrypoints=websecure"
      - "traefik.http.routers.varista.tls.certresolver=duckdns"
      - "traefik.http.services.varista.loadbalancer.server.port=80"
    networks:
      - web

  backend:
    image: bhanuchandra2010/varista-service:latest
    container_name: varista-backend
    ports:
      - "8081:8080"
    restart: unless-stopped
    environment:
      - spring.datasource.url=jdbc:mysql://192.168.0.228:3306/hrms_db
      - spring.datasource.username=hrms_user
      - spring.datasource.password=root@1234
      - spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - spring.jpa.hibernate.ddl-auto=none
      - spring.jpa.show-sql=true
      - spring.jpa.properties.hibernate.format_sql=true
      - varista.bankName=PUNJAB NATIONAL BANK
      - varista.accountNumber=685002100011758
      - varista.ifsc=PUNB0068500
      - invoice.directory=/invoice/
      - quotation.directory=/quotation/
    volumes:
      - ./data/invoice:/invoice:rw
      - ./data/quotation:/quotation:rw
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.service.rule=Host(`service.coresmith.duckdns.org`)"
      - "traefik.http.routers.service.entrypoints=websecure"
      - "traefik.http.routers.service.tls.certresolver=duckdns"
      - "traefik.http.services.service.loadbalancer.server.port=8080"
    networks:
      - web

networks:
  web:
    external: true
